version: '3.8'

services:
  mariadb:
   build: .
   container_name: mariadb
   
   environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: inception_db
    MYSQL_USER: merazafi
    MYSQL_PASSWORD: root
     
   volumes:
    - mariadb_data:/var/lib/mysql

   networks:
    - inception_network

   restart: always
     
networks:
  inception_network:
    driver: bridge
       
volumes:
  mariadb_data:
